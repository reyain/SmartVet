
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SmartVet</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/login.css">
    <script src="/js/login.js" defer></script>

</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">
            <span class="brand-mark">S</span>
            <span>SmartVet</span>
        </a>
    </header>

    <main class="container">
        <section class="login-card">
            <p class="eyebrow">SECURE ACCESS</p>
            <h1>Welcome back</h1>
            <p>Sign in to your SmartVet account.</p>

            <form id="loginForm">
                <div class="form-field">
                    <label for="email">Email address</label>
                    <input id="email" name="email" type="email"
                           autocomplete="username" required>
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password"
                           autocomplete="current-password" required>
                </div>

                <button class="primary-button" id="loginButton" type="submit">
                    Sign in
                </button>

                <p id="loginMessage" role="status" aria-live="polite"></p>
            </form>

            <a class="back-link" href="/">Back to SmartVet home</a>
        </section>
    </main>
</body>
</html>
